name: api

x-logging: &default-logging
  options:
    max-size: "5m"
    max-file: "1"
  driver: json-file

services:
  api:
    image: ghcr.io/apimgr/api:devel
    pull_policy: always
    container_name: api-app
    hostname: api
    restart: "no"
    logging: *default-logging
    environment:
      PORT: 80
      DEBUG: true
      MODE: development
      TZ: ${TZ:-America/New_York}
      CACHE_URL: valkey://api-cache:6379
    volumes:
      # CRITICAL: ./volumes/ must resolve to $TEMP_DIR/volumes/, NOT project directory
      # This file MUST be copied to a temp directory before running
      # AI: NEVER run this from the project directory
      - ./volumes/config:/config
      - ./volumes/data:/data
    ports:
      - "172.17.0.1:${HOST_PORT:-64581}:80"
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "--status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      api-cache:
        condition: service_healthy
    networks:
      - api

  api-cache:
    image: valkey/valkey:alpine
    pull_policy: always
    container_name: api-cache
    restart: "no"
    logging: *default-logging
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - api

networks:
  api:
    name: api
    external: false
