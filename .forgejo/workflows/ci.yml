name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: api
  INTERNAL_NAME: api

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine scan range
        id: range
        run: |
          BASE=""; HEAD=""
          if [ "${{ forgejo.event_name }}" = "push" ] && [ "${{ forgejo.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ forgejo.event.before }}"; HEAD="${{ forgejo.sha }}"
          elif [ "${{ forgejo.event_name }}" = "pull_request" ]; then
            BASE="${{ forgejo.event.pull_request.base.sha }}"; HEAD="${{ forgejo.event.pull_request.head.sha }}"
          fi
          echo "base=$BASE" >> "$FORGEJO_OUTPUT"
          echo "head=$HEAD" >> "$FORGEJO_OUTPUT"
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55  # v3.95.9
        with:
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          extra_args: --results=${{ steps.range.outputs.base == '' && 'verified' || 'verified,unknown' }} --exclude-paths=.github/trufflehog-exclude.txt

  lint:
    if: forgejo.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      options: "--user 0:0"
      image: casjaysdev/go:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Generate OpenAPI superset
        run: go generate ./src/swagger
      - run: go vet ./...
      - run: GOTOOLCHAIN=go1.26.4 staticcheck ./...

  test:
    if: forgejo.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      options: "--user 0:0"
      image: casjaysdev/go:latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Generate OpenAPI superset
        run: go generate ./src/swagger
      - name: Run tests with coverage
        run: |
          mkdir -p "/tmp/${{ forgejo.repository_owner }}"
          COVDIR=$(mktemp -d "/tmp/${{ forgejo.repository_owner }}/${INTERNAL_NAME}-XXXXXX")
          echo "COVDIR=$COVDIR" >> "$FORGEJO_ENV"
          mkdir -p "$COVDIR/data"
          TMPDIR="$COVDIR" go test -cover ./... -args -test.gocoverdir="$COVDIR/data"
          go tool covdata textfmt -i="$COVDIR/data" -o="$COVDIR/coverage.out"
      - name: Enforce coverage threshold
        run: |
          THRESHOLD=60
          PCT=$(go tool cover -func="$COVDIR/coverage.out" | awk '/^total:/ {gsub("%","",$3); print int($3)}')
          if [ "$PCT" -lt "$THRESHOLD" ]; then
            echo "::error::coverage $PCT% < threshold $THRESHOLD%"
            exit 1
          fi

  build:
    if: forgejo.event_name != 'schedule'
    needs: [lint, test]
    runs-on: ubuntu-26.04
    container:
      options: "--user 0:0"
      image: casjaysdev/go:latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Generate OpenAPI superset
        run: go generate ./src/swagger
      - run: go build -buildvcs=false ./...

  vuln-scan:
    runs-on: ubuntu-26.04
    container:
      options: "--user 0:0"
      image: casjaysdev/go:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Generate OpenAPI superset
        run: go generate ./src/swagger
      - run: govulncheck ./...

  workflow-policy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Verify action pinning and trigger policy
        run: |
          set -eo pipefail
          FAIL=0
          for f in .github/workflows/*.yml .gitea/workflows/*.yml .forgejo/workflows/*.yml; do
            if grep -qE '^\s*pull_request_target\s*:' "$f"; then
              echo "::error file=$f::pull_request_target trigger is not allowed"
              FAIL=1
            fi
            while IFS= read -r line; do
              ref=$(echo "$line" | sed -E 's/.*uses:[[:space:]]*[^@]+@([^[:space:]]+).*/\1/')
              if ! echo "$ref" | grep -qE '^[0-9a-f]{40}$'; then
                echo "::error file=$f::unpinned action reference: $line"
                FAIL=1
              fi
            done < <(grep -E '^\s*-?\s*uses:' "$f")
          done
          exit "$FAIL"

  image-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Build image
        run: docker build -f docker/Dockerfile -t api:ci-scan .
      - name: Check image runtime contract
        run: ./tests/check_image.sh api:ci-scan
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: api:ci-scan
          exit-code: '1'
          severity: CRITICAL,HIGH
